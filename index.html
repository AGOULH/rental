<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="app-build" content="202609091935">
<title>نظام إدارة الإيجارات v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* هوية "Blueprint / مخطط هندسي": رمادي فولاذي محايد، لون واحد فقط (accent)، بلا زوايا وبلا ظلال */
    --bg:#f2f2f3; --surface:transparent; --surface-2:#e9e9ea; --surface-3:#b7b7ba;
    --primary:#5980a6; --primary-d:#416180; --primary-l:rgba(89,128,166,.14);
    --text:#1d1f20; --muted:#5d5d60; --faint:#7a7a7d; --border:rgba(29,31,32,.16); --border-soft:rgba(29,31,32,.16); --line-soft:rgba(29,31,32,.08);
    --accent-300:#b5d9fd; --accent-500:#749dc4; --accent-700:#416180; --accent-900:#1d2d3d;
    --neutral-300:#d4d4d7; --neutral-400:#b7b7ba;
    /* لا ألوان دلالية مختلفة (أخضر/أحمر/أصفر) — الحالات تُميَّز بدرجة الفولاذي والوزن فقط */
    --success:#5d5d60; --success-l:rgba(29,31,32,.13);
    --warning:#1d2d3d; --warning-l:#b5d9fd;
    --danger:#1d2d3d; --danger-l:rgba(29,31,32,.20);
    --info:#416180; --info-l:rgba(89,128,166,.18);
    --font:'IBM Plex Sans Arabic','Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    --font-serif:'Barlow Condensed','IBM Plex Sans Arabic',sans-serif;
    --shadow:none;
    --shadow-lg:none;
    --radius:0; --radius-sm:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:var(--surface-3) transparent}
  body{
    font-family:var(--font);font-size:15px;
    background:var(--bg);color:var(--text);line-height:1.55;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:0}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:0;border:3px solid var(--bg);background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box}

  /* علامات تسجيل زوايا (Blueprint corner ticks) — تُضاف تلقائيًا على البطاقات/الجداول/النوافذ دون أي تعديل في البنية */
  .panel,.bcard,.modal,.stats,.bp{position:relative}
  .panel::before,.panel::after,.bcard::before,.bcard::after,.modal::before,.modal::after,.stats::before,.stats::after,.bp::before,.bp::after{
    content:'';position:absolute;width:11px;height:11px;pointer-events:none;z-index:3;
    background:
      linear-gradient(currentColor,currentColor) center/1px 100% no-repeat,
      linear-gradient(currentColor,currentColor) center/100% 1px no-repeat;
    color:rgba(29,31,32,.55);
  }
  .panel::before,.bcard::before,.modal::before,.stats::before,.bp::before{top:-6px;left:-6px}
  .panel::after,.bcard::after,.modal::after,.stats::after,.bp::after{bottom:-6px;right:-6px}

  /* Header — شريط تقني مسطّح، بلا كبسولة وبلا ظل */
  header{
    position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);height:60px;
  }
  .head-inner{
    max-width:1280px;height:60px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.02em}
  .brand .logo{width:30px;height:30px;background:transparent;color:var(--text);border:1px solid var(--text);border-radius:0;display:grid;place-items:center;font-size:16px}
  nav{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
  nav button{
    background:transparent;color:var(--muted);border:none;border-bottom:2px solid transparent;padding:9px 14px;border-radius:0;
    font-size:14px;font-weight:600;transition:.18s ease;display:inline-flex;align-items:center;gap:7px;
  }
  nav button:hover{color:var(--text)}
  nav button.active{color:var(--primary);border-bottom-color:var(--primary)}
  .nav-ic{font-size:15px;line-height:1;display:inline-flex;opacity:.6}
  nav button.active .nav-ic{opacity:1}

  .wrap{max-width:1280px;margin:0 auto;padding:26px 20px 60px}

  /* Page heading — سطر ترقيم تقني علوي بدل أيقونة العنوان */
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .page-head::before{content:attr(data-eyebrow);display:block;font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:600;margin-bottom:4px;width:100%}
  .page-head h1{font-family:var(--font-serif);font-size:28px;font-weight:600}
  .page-head h1 svg{display:none}
  .page-head .sub{color:var(--muted);font-size:14px;margin-top:3px}
  .crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:8px}
  .crumbs a{color:var(--text);cursor:pointer;text-decoration:underline;font-weight:600}
  .crumbs a:hover{color:var(--primary)}

  /* Buttons — مستطيل صارم بلا زوايا، لون واحد للفعل الأساسي */
  .btn{border:none;border-radius:0;padding:8px 14px;font-family:var(--font-serif);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s ease;background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn:hover{background:var(--surface-2)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:var(--primary-d);border-color:var(--primary-d)}
  .btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn-danger:hover{filter:brightness(.92)}
  .btn-sm{padding:6px 14px;font-size:13px}
  .btn-ghost{background:transparent;border:1px solid var(--border)}
  .btn-ghost:hover{background:var(--surface)}

  /* شريط المؤشرات الموحّد — بلا مربعات ملوّنة، بلا زوايا، خط شعري واحد يفصل الخلايا */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--border);margin-bottom:26px}
  @media (max-width:900px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .stat{background:transparent;padding:16px 18px;position:relative;transition:.15s ease;border-inline-start:1px solid var(--border)}
  .stat:first-child{border-inline-start:none}
  @media (max-width:900px){ .stat:nth-child(2n+1){border-inline-start:none} .stat{border-top:1px solid var(--border)} .stat:nth-child(-n+2){border-top:none} }
  .stat .lbl{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
  .stat .lbl .ic{width:16px;height:16px;flex:none;display:inline-flex;color:var(--muted)}
  .stat .lbl .ic svg{width:16px;height:16px}
  .stat .val{font-family:var(--font-serif);font-size:44px;font-weight:600;line-height:1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .stat .val .sec{font-family:var(--font);font-size:14px;font-weight:500;color:var(--muted)}
  .stat .ctx{font-size:12.5px;color:var(--muted);margin-top:8px}
  .stat .mbar{height:4px;background:var(--neutral-300);margin-top:10px;overflow:hidden}
  .stat .mbar>span{display:block;height:100%;background:var(--primary)}
  .stat .mspark{display:flex;align-items:flex-end;gap:3px;height:22px;margin-top:10px}
  .stat .mspark span{flex:1;background:rgba(29,31,32,.14);min-height:3px}
  .stat.clickable{cursor:pointer}
  .stat.clickable:hover{background:var(--surface-2)}
  .stat .stat-go{position:absolute;bottom:14px;left:18px;font-size:11px;font-weight:700;color:var(--primary);opacity:0;transition:.18s}
  .stat.clickable:hover .stat-go{opacity:1}
  .stat.dark{background:var(--accent-900);color:var(--bg)}
  .stat.dark .lbl,.stat.dark .lbl .ic,.stat.dark .ctx,.stat.dark .val .sec{color:rgba(242,242,243,.65)}
  .stat.dark .mspark span{background:rgba(242,242,243,.3)}
  .stat.dark .mspark span:last-child{background:var(--bg)}
  .stat.dark.clickable:hover{background:var(--accent-700)}
  .stat.dark .stat-go{color:var(--bg)}
  tbody tr.rowlink{cursor:pointer}

  .panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:22px;overflow:hidden}
  .panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .panel-head h2{font-family:var(--font-serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:.005em}
  .panel-head .count{background:var(--surface-2);color:var(--text);font-size:12px;font-weight:700;padding:4px 11px;border-radius:0;border:1px solid var(--border)}
  .panel-body{padding:6px 0}
  .panel-body.pad{padding:19px 20px}

  /* Tables */
  table{width:100%;border-collapse:collapse}
  th,td{padding:13px 18px;text-align:right;font-size:14px}
  th{color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.02em;border-bottom:2px solid var(--border);white-space:nowrap}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
  tbody tr:nth-child(even){background:rgba(20,20,19,.025)}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--primary-l)}
  td .muted{color:var(--muted);font-size:12.5px}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:0;font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
  .b-green{background:var(--success-l);color:var(--success);border-color:rgba(29,31,32,.22)}
  .b-red{background:var(--danger-l);color:var(--danger);border-color:rgba(29,31,32,.4)}
  .b-amber{background:var(--warning-l);color:var(--warning);border-color:rgba(29,31,32,.3)}
  .b-blue{background:var(--info-l);color:var(--info);border-color:rgba(65,97,128,.4)}
  .b-gray{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
  .dot{width:6px;height:6px;border-radius:0;display:inline-block}

  /* Building cards */
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .bcard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:.18s ease}
  .bcard:hover{border-color:var(--border-soft)}
  .bcard .top{background:var(--surface-2);color:var(--text);padding:17px 19px;border-bottom:1px solid var(--border)}
  .bcard .top .name{font-family:var(--font-serif);font-size:18px;font-weight:600}
  .bcard .top .addr{font-size:13px;opacity:.85;margin-top:3px}
  .bcard .body{padding:15px 19px;display:flex;gap:18px;flex-wrap:wrap}
  .bcard .mini{display:flex;flex-direction:column}
  .bcard .mini .n{font-size:20px;font-weight:800}
  .bcard .mini .t{font-size:12px;color:var(--muted);font-weight:600}

  /* progress bar */
  .pbar{height:8px;border-radius:0;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
  .pbar > span{display:block;height:100%;background:var(--success);transition:width .3s ease}

  /* Empty states */
  .empty{text-align:center;padding:56px 20px;color:var(--muted)}
  .empty .em{font-size:56px;margin-bottom:12px}
  .empty h3{color:var(--text);font-family:var(--font-serif);font-size:19px;margin-bottom:7px;font-weight:600}
  .empty p{margin-bottom:20px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(20,20,19,.65);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:20px}
  .modal{background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);width:100%;max-width:560px;max-height:92vh;overflow:auto}
  .modal.lg{max-width:840px}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);z-index:2}
  .modal-head h3{font-family:var(--font-serif);font-size:19px;font-weight:600;display:flex;align-items:center;gap:9px}
  .modal-body{padding:22px}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start;position:sticky;bottom:0;background:var(--bg)}
  .x{background:var(--surface-2);border:none;width:34px;height:34px;border-radius:0;font-size:18px;color:var(--muted);transition:.15s}
  .x:hover{background:var(--danger-l);color:var(--danger)}

  /* Forms */
  .field{margin-bottom:17px}
  .field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
  .field .hint{font-weight:500;color:var(--muted);font-size:12px}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);background:var(--surface-2)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

  .info-box{background:var(--info-l);border:1px solid var(--border);color:var(--info);border-radius:0;padding:14px 16px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
  .formula{background:var(--surface-2);border:1px dashed var(--border);border-radius:0;padding:12px 15px;font-size:14px;color:var(--text);margin-top:6px;line-height:1.9}
  .formula b{color:var(--primary-d)}

  details.acct-info{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px}
  details.acct-info summary{cursor:pointer;padding:15px 19px;font-weight:800;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
  details.acct-info summary::-webkit-details-marker{display:none}
  details.acct-info summary::before{content:'▸';color:var(--primary);font-size:12px}
  details.acct-info[open] summary::before{content:'▾'}
  details.acct-info summary:hover{color:var(--primary-d)}
  details.acct-info .info-box{margin:0 19px 17px}

  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:6px}
  .dcell{background:var(--surface-2);border:1px solid var(--border);border-radius:0;padding:13px 15px}
  .dcell .t{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .dcell .v{font-size:15px;font-weight:700}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:10px 38px 10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
  .search .si{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}

  @media (max-width:600px){
    .row2,.row3{grid-template-columns:1fr}
    th,td{padding:10px 12px}
    .head-inner{padding:12px}
    nav button{padding:8px 12px;font-size:13px}
    .dash-2col{grid-template-columns:1fr!important}
  }
  @media print{body{background:#fff}.no-print{display:none!important}}

  /* مزامنة سحابية + شاشة رمز الدخول */
  .sync-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:0;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--border);color:var(--text);white-space:nowrap;transition:.15s}
  .sync-badge.ok{background:var(--success-l);color:var(--success);border-color:transparent}
  .sync-badge.off{background:var(--warning-l);color:var(--warning);border-color:transparent}
  .sync-badge:hover{filter:brightness(1.06)}
  .update-banner{position:fixed;inset-inline:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:var(--accent-900);color:#fff;font-size:13px;font-weight:600}
  .update-banner button{background:#fff;color:var(--accent-900);border:none;border-radius:0;padding:6px 14px;font-size:12px;font-weight:700}
  .overlay.gate{background:var(--bg);z-index:200}
  .gatebox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:38px 32px;width:100%;max-width:410px;text-align:center}
  .gate-logo{margin-bottom:8px;display:flex;justify-content:center}
  .gate-logo svg{width:44px;height:44px;color:var(--primary)}
  .gatebox h2{font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--text);margin-bottom:8px}
  .gatebox p{color:var(--muted);font-size:14px;margin-bottom:18px}
  .gate-hint{color:var(--primary);font-size:12.5px;font-weight:600}
  #gate-code{width:100%;padding:14px 15px;border:1.5px solid var(--border);border-radius:0;background:var(--surface-2);color:var(--text);font-size:17px;text-align:center;letter-spacing:3px;margin-bottom:14px}
  #gate-code:focus{outline:none;border-color:var(--primary);background:var(--surface-2)}
  .gate-btn{width:100%;justify-content:center;padding:14px;font-size:15px}
  .gate-foot{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.7}

  /* أيقونات — خطية موحّدة 17px، بلا خلفية ملوّنة وبلا حركات زخرفية (هوية Blueprint تقنية ساكنة) */
  .page-head h1{display:flex;align-items:center;gap:10px}
  .crumbs svg{color:var(--muted);width:17px;height:17px;flex-shrink:0}
  .empty .em{display:flex;justify-content:center;margin-bottom:14px;color:var(--muted)}
  .empty .em svg{width:44px;height:44px;opacity:.55}
  .bcard .top .name{display:flex;align-items:center;gap:7px}
  .bcard .top .name svg{width:17px;height:17px;flex-shrink:0;opacity:.7}
  .brand{cursor:default}
  nav button .nav-ic{transition:opacity .15s}
  nav button:hover .nav-ic{opacity:1}
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M9 15h1.5M13.5 15H15M10 21v-3.5h4V21"/></svg></span><span>نظام إدارة الإيجارات</span></div>
    <span id="syncBadge" class="sync-badge" style="display:none" onclick="cloudLogout()" title="اضغط لتغيير الرمز / تسجيل الخروج"></span>
    <nav id="nav">
      <button data-v="dashboard" onclick="go('dashboard')"><span class="nav-ic"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>لوحة التحكم</button>

function parseISO(iso){ return new Date(iso+'T00:00:00'); }
function addMonths(iso,n){
  const d=parseISO(iso); const day=d.getDate();
  d.setMonth(d.getMonth()+n);
  if(d.getDate()<day) d.setDate(0); // ضبط نهاية الشهر
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============================ منطق الدفعات ============================
   معادلة الاستحقاق: تاريخ الدفعة (ن) = تاريخ بداية العقد + (ن−1) × 3 أشهر
   عدد الدفعات = مدة العقد بالأشهر ÷ 3                                       */
function buildSchedule(unit){
  const mos=periodMos(unit);
  const count=Math.max(1,Math.ceil((Number(unit.durationMonths)||12)/mos));
  const prev={}; (unit.payments||[]).forEach(p=>{ prev[p.dueDate]=p; });
  const list=[];
  for(let i=0;i<count;i++){
    const due=addMonths(unit.contractStart,i*mos);
    const ex=prev[due];
    list.push({id:ex?ex.id:uid(),n:i+1,dueDate:due,amount:periodAmount(unit),status:ex?ex.status:'unpaid',paidDate:ex?ex.paidDate:null,paidAmount:ex?(ex.paidAmount||0):0,paymentsLog:ex?(ex.paymentsLog||[]):[]});
  }
  return list;
}
function payStatus(p){
  if(p.status==='paid') return 'paid';
  if(daysFromToday(p.dueDate)<0) return 'overdue';
  if(daysFromToday(p.dueDate)<=db.settings.paymentReminderDays) return 'due';
  return 'upcoming';
}
function contractEnd(unit){ return addMonths(unit.contractStart, Number(unit.durationMonths)||12); }
function unitsOf(bId){ return db.units.filter(u=>u.buildingId===bId); }
function nextUnpaid(unit){
  return (unit.payments||[]).filter(p=>p.status!=='paid').sort((a,b)=>a.dueDate<b.dueDate?-1:1)[0]||null;
}
function remainingAmt(p){ return Math.max(0,(p.amount||0)-(p.paidAmount||0)); }
function unitTotals(unit){
  const ps=unit.payments||[];
  const paid=ps.reduce((s,p)=>s+(p.paidAmount||0),0);
  const total=ps.reduce((s,p)=>s+p.amount,0);
  const overdue=ps.filter(p=>payStatus(p)==='overdue').reduce((s,p)=>s+remainingAmt(p),0);
  return {paid,total,remaining:total-paid,overdue,
    overdueCount:ps.filter(p=>payStatus(p)==='overdue').length,
    partialCount:ps.filter(p=>p.status==='partial').length};
}
/* ملخص التعثر (الشغور) للوحدة الشاغرة: منذ متى شاغرة + القيمة الإجمالية المفقودة خلال فترة التعثر */
function vacancyInfo(unit){
  if(unit.tenantName) return null;
  const hist=unit.history||[];
  const since=hist.length?hist[hist.length-1].endedAt:unit.contractStart;
  if(!since) return null;
  const days=Math.max(0,-daysFromToday(since));
  const lastRent=Number(unit.rentAmount)||(hist.length?Number(hist[hist.length-1].rentAmount||hist[hist.length-1].quarterlyRent)||0:0);
  const lostValue=Math.round(lastRent/365*days);
  return {since,days,lostValue};
}

function stat(ic,val,lbl,ctx,action,opts){
  opts=opts||{};
  let barHtml='';
  if(opts.spark && opts.spark.length){
    const max=Math.max(...opts.spark,1);
    barHtml=`<div class="mspark">${opts.spark.map(v=>`<span style="height:${Math.max(8,Math.round(v/max*100))}%"></span>`).join('')}</div>`;
  } else if(opts.ratio!=null){
    barHtml=`<div class="mbar"><span style="width:${Math.max(0,Math.min(100,opts.ratio))}%"></span></div>`;
  }
  return `<div class="stat${opts.dark?' dark':''}${action?' clickable':''}"${action?` onclick="${action}"`:''}>
    <div class="lbl">${ic?`<span class="ic">${ic}</span>`:''}${lbl}</div>
    <div class="val">${val}${opts.sec?`<span class="sec">${opts.sec}</span>`:''}</div>
    ${ctx?`<div class="ctx">${ctx}</div>`:''}
    ${barHtml}
    ${action?'<div class="stat-go">عرض ›</div>':''}</div>`;
}
/* مجموع المحصّل شهريًا لآخر 7 أشهر — من سجل الدفعات الفعلي (paymentsLog)، للرسم المصغّر في بطاقة «إجمالي المحصّل» */
function last7MonthsCollected(){
  const now=new Date();
  const months=[];
  for(let i=6;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const sums={}; months.forEach(m=>sums[m]=0);
  const addLogs=(payments)=>{ (payments||[]).forEach(p=>{ (p.paymentsLog||[]).forEach(l=>{ const m=(l.date||'').slice(0,7); if(m in sums) sums[m]+=Number(l.amount)||0; }); }); };
  db.units.forEach(u=>{ addLogs(u.payments); (u.history||[]).forEach(tn=>addLogs(tn.payments)); });
  return months.map(m=>sums[m]);
}

/* ============================ المحاسبة ============================ */
let acctYear = null;
let acctBuildingId = null; // null = كل العقارات
let acctCategory = null; // null = كل البنود
const EXPENSE_CATS=['صيانة','كهرباء','ماء','رسوم حكومية','ضرائب/زكاة','إدارة','تأمين','تنظيف','أخرى'];
function yearOf(iso){ return iso ? parseInt(iso.slice(0,4)) : null; }
function quarterOf(iso){ return iso ? Math.floor((parseInt(iso.slice(5,7))-1)/3)+1 : null; }
function allYears(){
  const ys=new Set();
  db.units.forEach(u=>(u.payments||[]).forEach(p=>{ if(p.dueDate) ys.add(yearOf(p.dueDate)); }));
  (db.expenses||[]).forEach(e=>{ if(e.date) ys.add(yearOf(e.date)); });
  ys.add(new Date().getFullYear());
  return [...ys].sort((a,b)=>b-a);
}
/* إجمالي مصروفات بند معيّن (افتراضيًا: صيانة) لعقار/سنة */
function categoryExpenses(year, buildingId, category){
  return (db.expenses||[]).filter(e=>yearOf(e.date)===year && (!buildingId||e.buildingId===buildingId) && (!category||e.category===category))
    .reduce((s,e)=>s+(Number(e.amount)||0),0);
}
/* تجميع محاسبي لفترة (سنة/ربع/عقار) — المستحق = التجميع حسب تاريخ استحقاق كل دفعة فعلية خلال الفترة */
function acct(year, quarter, buildingId){
  let expected=0, collected=0, overdue=0;
  db.units.forEach(u=>{
    if(buildingId && u.buildingId!==buildingId) return;
    let pays=(u.payments||[]).slice();
    (u.history||[]).forEach(t=>{ pays=pays.concat(t.payments||[]); }); // تشمل دفعات المستأجرين السابقين
    pays.forEach(p=>{
      if(yearOf(p.dueDate)!==year) return;
      if(quarter && quarterOf(p.dueDate)!==quarter) return;
      expected += p.amount;
      collected += (p.paidAmount||0);
      if(p.status!=='paid' && daysFromToday(p.dueDate)<0) overdue += (p.amount-(p.paidAmount||0));
    });
  });
  const expenses=categoryExpenses(year,buildingId,null);
  return { expected, collected, outstanding:expected-collected, overdue, expenses, net:collected-expenses, rate: expected?Math.round(collected/expected*100):0 };
}
function rateBar(rate){
  const col=rate>=90?'var(--success)':rate>=60?'var(--warning)':'var(--danger)';
  return `<div style="display:flex;align-items:center;gap:8px"><div class="pbar" style="width:70px"><span style="width:${rate}%;background:${col}"></span></div><span style="font-weight:700;font-size:12.5px">${rate}%</span></div>`;
}

  openModal(`<div class="modal"><div class="modal-head"><h3>${eId?svgIcon('edit')+' تعديل مصروف':svgIcon('plus')+' إضافة مصروف'}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="row2">
        <div class="field"><label>العقار</label><select id="e-building"><option value="">عام (غير مخصّص)</option>${db.buildings.map(b=>`<option value="${b.id}" ${e.buildingId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
        <div class="field"><label>البند *</label><select id="e-cat"><option value="" ${!e.category?'selected':''}>اختر البند...</option>${cats.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label>المبلغ ( ${db.settings.currency} ) *</label><input type="number" id="e-amount" value="${e.amount||''}" placeholder="مثال: 1500"></div>
        <div class="field"><label>التاريخ *</label><input type="date" id="e-date" value="${e.date||todayISO()}"></div>
      </div>
      <div class="field"><label>الوصف</label><input id="e-note" value="${esc(e.note||'')}" placeholder="تفاصيل المصروف"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="saveExpense('${eId||''}')">${svgIcon('save')} حفظ</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
      ${eId?`<button class="btn btn-danger" style="margin-inline-start:auto" onclick="deleteExpense('${eId}')">${svgIcon('trash')} حذف</button>`:''}
    </div></div>`);
}
function saveExpense(eId){
  const amount=parseFloat(document.getElementById('e-amount').value)||0;
  const date=document.getElementById('e-date').value;
  const category=document.getElementById('e-cat').value;
  if(!category){ alert('اختر بند المصروف'); return; }
  if(amount<=0){ alert('أدخل مبلغًا صحيحًا'); return; }
  if(!date){ alert('أدخل التاريخ'); return; }
  const data={ buildingId:document.getElementById('e-building').value||null,
    category, amount, date,
    note:document.getElementById('e-note').value.trim() };
  if(eId){ Object.assign(db.expenses.find(x=>x.id===eId),data); }
  else{ db.expenses.push({id:uid(),...data}); }
  save(); closeModal(); render();
}
function deleteExpense(eId){
  if(!confirm('حذف هذا المصروف؟')) return;
  db.expenses=db.expenses.filter(x=>x.id!==eId);
  save(); closeModal(); render();
}

/* ---------- قائمة العقارات ---------- */
function viewProperties(){
  if(db.buildings.length===0) return pageEmpty();
  let h=`<div class="page-head" data-eyebrow="PROPERTIES / 02"><div><h1>${svgIcon('building')} العقارات</h1>
    <div class="sub">${db.buildings.length} عقار • ${db.units.length} وحدة</div></div>
    <button class="btn btn-primary" onclick="openBuildingForm()">${svgIcon('plus')} إضافة عقار</button></div>`;
  h+=`<div class="bgrid">`;
  db.buildings.forEach(b=>{
    const us=unitsOf(b.id);
    const occupied=us.filter(u=>u.tenantName).length;
    let overdue=0; us.forEach(u=>{ (u.payments||[]).forEach(p=>{ if(payStatus(p)==='overdue') overdue++; }); });
    h+=`<div class="bcard" onclick="go('building','${b.id}')">
      <div class="top"><div class="name">${svgIcon('building')} ${esc(b.name)}</div>${b.address?`<div class="addr">${svgIcon('pin')} ${esc(b.address)}</div>`:''}</div>
      <div class="body">
        <div class="mini"><span class="n">${us.length}</span><span class="t">وحدة</span></div>
        <div class="mini"><span class="n" style="color:var(--success)">${occupied}</span><span class="t">مؤجّرة</span></div>
        <div class="mini"><span class="n" style="color:${overdue?'var(--danger)':'var(--muted)'}">${overdue}</span><span class="t">متأخرات</span></div>
        ${b.deliveryDate?`<div class="mini"><span class="n" style="font-size:13px;color:var(--info)">${svgIcon('key')} ${fmtDate(b.deliveryDate)}</span><span class="t">تسليم</span></div>`:''}
      </div></div>`;
  });
  h+=`</div>`;
  return h;
}

/* ---------- تفاصيل العقار ---------- */
function viewBuilding(bId){
  const b=db.buildings.find(x=>x.id===bId);
  if(!b) return pageEmpty();
  const us=unitsOf(bId);
  let h=`<div class="crumbs"><a onclick="go('properties')">العقارات</a><span>›</span><span>${esc(b.name)}</span></div>`;
  h+=`<div class="page-head" data-eyebrow="PROPERTY / 02"><div><h1>${svgIcon('building')} ${esc(b.name)}</h1>
    <div class="sub">${b.address?svgIcon('pin')+' '+esc(b.address)+' • ':''}${us.length} وحدة${b.waterMeter?' • '+svgIcon('drop')+' '+esc(b.waterMeter):''}${b.deliveryDate?' • '+svgIcon('key')+' التسليم: '+fmtDate(b.deliveryDate):''}</div></div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="openBuildingForm('${b.id}')">${svgIcon('edit')} تعديل العقار</button>
      <button class="btn btn-primary" onclick="openUnitForm('${b.id}')">${svgIcon('plus')} إضافة وحدة</button>
    </div></div>`;
  if(b.notes) h+=`<div class="info-box" style="margin-bottom:18px">${svgIcon('doc')} <div>${esc(b.notes)}</div></div>`;

  // معلومات الملكية (صك + ماء + مرفقات)
  const _hasPropInfo=b.deedNumber||b.deedDate||b.waterMeter||b.propertyValue||b.deedImage||(b.attachments&&b.attachments.length);
  if(_hasPropInfo){
    h+=`<div class="panel" style="margin-bottom:18px"><div class="panel-head"><h2>${svgIcon('list')} معلومات الملكية</h2></div><div class="panel-body pad">`;
    if(b.deedNumber||b.deedDate||b.waterMeter||b.propertyValue){
      h+=`<div class="detail-grid" style="margin-bottom:14px">`;
      if(b.deedNumber) h+=`<div class="dcell"><div class="t">رقم الصك</div><div class="v">${esc(b.deedNumber)}</div></div>`;
      if(b.deedDate) h+=`<div class="dcell"><div class="t">تاريخ الصك</div><div class="v">${fmtDate(b.deedDate)}</div></div>`;
      if(b.waterMeter) h+=`<div class="dcell"><div class="t">عداد الماء ${svgIcon('drop')}</div><div class="v">${esc(b.waterMeter)}</div></div>`;
      if(b.propertyValue){
        const _yr=acct(new Date().getFullYear(),null,b.id);
        const _roi=Math.round(_yr.net/b.propertyValue*1000)/10;
        h+=`<div class="dcell"><div class="t">قيمة العقار</div><div class="v">${fmtMoney(b.propertyValue)}</div></div>`;
        h+=`<div class="dcell"><div class="t">نسبة العائد السنوي</div><div class="v" style="color:${_yr.net>=0?'var(--success)':'var(--danger)'}">${_roi}%</div></div>`;
      }
      h+=`</div>`;
    }
    if(b.deedImage){
      const di=b.deedImage; const diImg=di.type&&di.type.startsWith('image/');
      h+=`<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">${svgIcon('doc')} صورة الصك</div>
        <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:0">
          ${diImg?`<img src="${di.data}" style="width:64px;height:64px;object-fit:cover;border-radius:0;cursor:pointer" onclick="openBuildingFile('${b.id}','deed',0)">`:`<span style="font-size:36px">${svgIcon('doc')}</span>`}
          <div style="flex:1;font-size:13px;font-weight:700">${esc(di.name)}</div>
          <a href="${di.data}" download="${esc(di.name)}" class="btn btn-sm">${svgIcon('download')} تنزيل</a>
        </div></div>`;
    }
    if(b.attachments&&b.attachments.length){
      h+=`<div><div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px">${svgIcon('doc')} مرفقات أخرى (${b.attachments.length})</div>`;
      b.attachments.forEach((a,i)=>{
        const aImg=a.type&&a.type.startsWith('image/');
        h+=`<div style="display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:0;margin-bottom:6px">
          ${aImg?`<img src="${a.data}" style="width:40px;height:40px;object-fit:cover;border-radius:0;cursor:pointer" onclick="openBuildingFile('${b.id}','att',${i})">`:`<span style="font-size:24px">${svgIcon('doc')}</span>`}
          <div style="flex:1;font-size:13px;font-weight:700">${esc(a.name)}</div>
          <a href="${a.data}" download="${esc(a.name)}" class="btn btn-sm">${svgIcon('download')}</a>
        </div>`;
      });
      h+=`</div>`;
    }
    h+=`</div></div>`;
  }

  if(us.length===0){
    h+=`<div class="panel"><div class="empty"><div class="em">${svgIcon('door')}</div><h3>لا توجد وحدات بعد</h3>
      <p>أضف الشقق أو المحلات التابعة لهذا العقار لبدء متابعة الإيجارات.</p>
      <button class="btn btn-primary" onclick="openUnitForm('${b.id}')">${svgIcon('plus')} إضافة أول وحدة</button></div></div>`;
    return h;
  }
  h+=`<div class="panel"><div class="panel-head"><h2>${svgIcon('door')} الوحدات</h2><span class="count">${us.length}</span></div>
    <div class="panel-body"><table><thead><tr>
      <th>الوحدة</th><th>المستأجر</th><th>الإيجار الكامل</th><th>الدورية</th><th>بداية العقد</th>
      <th>الدفعة القادمة</th><th>الحالة</th><th>التحصيل</th><th></th></tr></thead><tbody>`;
  us.forEach(u=>{
    const t=unitTotals(u); const nx=nextUnpaid(u);
    const pct=t.total?Math.round(t.paid/t.total*100):0;
    const vac=vacancyInfo(u);
    let statusBadge;
    if(t.overdueCount) statusBadge=`<span class="badge b-red">متأخر ${t.overdueCount}</span>`;
    else if(!u.tenantName) statusBadge=`<span class="badge b-amber">متعثر${vac?' '+vac.days+' يوم':''}</span>`;
    else if(t.remaining===0) statusBadge=`<span class="badge b-green">مسدّد بالكامل</span>`;
    else statusBadge=`<span class="badge b-blue">منتظم</span>`;
    h+=`<tr>
      <td style="font-weight:800">${esc(u.name)}${u.electricityMeter?`<div class="muted">${svgIcon('bolt')} ${esc(u.electricityMeter)}</div>`:''}</td>
      <td>${u.tenantName?esc(u.tenantName):'<span class="muted">— شاغرة —</span>'}${u.tenantPhone?`<div class="muted">${svgIcon('phone')} ${esc(u.tenantPhone)}</div>`:''}</td>
      <td style="font-weight:700">${u.tenantName?fmtMoney(u.rentAmount)+'<div class="muted">دفعة: '+fmtMoney(periodAmount(u))+'</div>':'<span class="muted">—</span>'}</td>
      <td><span class="badge b-gray">${periodLbl(u)}</span></td>
      <td>${fmtDate(u.contractStart)}</td>
      <td>${nx?fmtDate(nx.dueDate):'<span class="muted">—</span>'}</td>
      <td>${statusBadge}</td>
      <td style="min-width:120px">${vac?`<div class="muted">منذ ${fmtDate(vac.since)}</div><div style="font-weight:700;color:var(--warning)">قيمة التعثر: ${fmtMoney(vac.lostValue)}</div>`:`<div class="pbar"><span style="width:${pct}%"></span></div><div class="muted" style="margin-top:3px">${pct}% • باقٍ ${fmtMoney(t.remaining)}</div>`}</td>
      <td><button class="btn btn-sm btn-primary" onclick="openUnit('${u.id}')">إدارة</button></td>
    </tr>`;
  });
  const rentedUs=us.filter(u=>u.tenantName);
  const totRent=rentedUs.reduce((s,u)=>s+(Number(u.rentAmount)||0),0);
  const totPeriod=rentedUs.reduce((s,u)=>s+periodAmount(u),0);
  const totPaid=us.reduce((s,u)=>s+unitTotals(u).paid,0);
  const totRemaining=us.reduce((s,u)=>s+unitTotals(u).remaining,0);
  h+=`<tr style="background:var(--surface-2);font-weight:800;border-top:2px solid var(--border)">
      <td colspan="2">الإجمالي (${rentedUs.length} مؤجّرة من ${us.length})</td>
      <td>${fmtMoney(totRent)}<div class="muted" style="font-weight:700">دفعة: ${fmtMoney(totPeriod)}</div></td>
      <td colspan="3"></td>
      <td></td>
      <td style="min-width:120px">${fmtMoney(totPaid)}<div class="muted" style="margin-top:3px;font-weight:700">باقٍ ${fmtMoney(totRemaining)}</div></td>
      <td></td>
    </tr>`;
  h+=`</tbody></table></div></div>`;
  return h;
}

/* ============================ النوافذ المنبثقة ============================ */
function openModal(html){ document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">${html}</div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ---------- مساعدات نموذج العقار (صك + مرفقات) ---------- */
function _bRenderDeed(){
  const el=document.getElementById('b-deed-prev'); if(!el) return;
  if(!_bForm.deedImage){ el.innerHTML=''; return; }
  const d=_bForm.deedImage; const isImg=d.type&&d.type.startsWith('image/');
  el.innerHTML=`<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:0;margin-top:7px">
    ${isImg?`<img src="${d.data}" style="width:56px;height:56px;object-fit:cover;border-radius:0">`:`<span style="font-size:34px">${svgIcon('doc')}</span>`}
    <div style="flex:1;font-size:13px;font-weight:700;word-break:break-all">${esc(d.name)}</div>
    <a href="${d.data}" download="${esc(d.name)}" class="btn btn-sm" title="تنزيل">${svgIcon('download')}</a>
    <button class="btn btn-sm" onclick="_bForm.deedImage=null;_bRenderDeed()" title="حذف">${svgIcon('trash')}</button>
  </div>`;
}
function _bRenderAtts(){
  const el=document.getElementById('b-att-list'); if(!el) return;
  if(!_bForm.attachments.length){ el.innerHTML='<div style="color:var(--muted);font-size:13px;padding:4px 0">لا توجد مرفقات</div>'; return; }
  el.innerHTML=_bForm.attachments.map((a,i)=>{
    const isImg=a.type&&a.type.startsWith('image/');
    return `<div style="display:flex;align-items:center;gap:9px;padding:7px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:0;margin-bottom:6px">
      ${isImg?`<img src="${a.data}" style="width:40px;height:40px;object-fit:cover;border-radius:0">`:`<span style="font-size:24px">${svgIcon('doc')}</span>`}
      <div style="flex:1;font-size:13px;font-weight:700;word-break:break-all">${esc(a.name)}</div>
      <a href="${a.data}" download="${esc(a.name)}" class="btn btn-sm" title="تنزيل">${svgIcon('download')}</a>
      <button class="btn btn-sm" onclick="_bForm.attachments.splice(${i},1);_bRenderAtts()" title="حذف">${svgIcon('trash')}</button>
    </div>`;
  }).join('');
}
function _bDeedFile(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ _bForm.deedImage={name:f.name,type:f.type,data:e.target.result}; _bRenderDeed(); };
  r.readAsDataURL(f); input.value='';
}
function _bAddAtt(input){
  const files=Array.from(input.files); let cnt=files.length; if(!cnt) return;
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{ _bForm.attachments.push({id:uid(),name:f.name,type:f.type,data:e.target.result}); if(--cnt===0) _bRenderAtts(); };
    r.readAsDataURL(f);
  });
  input.value='';
}
function openBuildingFile(bId,type,idx){
  const b=db.buildings.find(x=>x.id===bId); if(!b) return;
  const d=(type==='deed'?b.deedImage:((b.attachments||[])[idx])); if(!d||!d.data) return;
  if(d.type&&d.type.startsWith('image/')){
    const w=window.open('','_blank');
    w.document.write(`<html><body style="margin:0;background:#111;display:flex;justify-content:center"><img src="${d.data}" style="max-width:100%;height:auto;display:block"></body></html>`);
    w.document.close();
  } else { window.open(d.data,'_blank'); }
}

      <div class="row2">
        <div class="field"><label>عداد الماء ${svgIcon('drop')}</label><input id="b-water" value="${esc(b.waterMeter||'')}" placeholder="رقم عداد الماء (اختياري)"></div>

function saveBuilding(bId){

  const data={ name, address:document.getElementById('b-addr').value.trim(),
    deliveryDate:document.getElementById('b-deliv').value||null,
    deedNumber:document.getElementById('b-deed-num').value.trim(),
    deedDate:document.getElementById('b-deed-date').value||null,
    propertyValue:Number(document.getElementById('b-value').value)||0,
    waterMeter:document.getElementById('b-water').value.trim(),
    deedImage:_bForm.deedImage,
    attachments:_bForm.attachments.slice(),
    notes:document.getElementById('b-notes').value.trim() };
  if(bId){ Object.assign(db.buildings.find(x=>x.id===bId),data); }
  else{ const id=uid(); db.buildings.push({id,...data,createdAt:todayISO()}); }

function deleteBuilding(bId){
  const us=unitsOf(bId);
  if(!confirm(`سيتم حذف العقار و${us.length} وحدة تابعة له نهائيًا. متأكد؟`)) return;
  db.buildings=db.buildings.filter(x=>x.id!==bId);
  db.units=db.units.filter(u=>u.buildingId!==bId);
  save(); closeModal(); go('properties');
}

function saveUnit(bId,uId){
  const name=document.getElementById('u-name').value.trim();
  const start=document.getElementById('u-start').value;
  const rent=parseFloat(document.getElementById('u-rent').value)||0;
  if(!name){ alert('يرجى إدخال اسم/رقم الوحدة'); return; }
  if(!start){ alert('يرجى إدخال تاريخ بداية العقد'); return; }
  if(rent<=0){ alert('يرجى إدخال قيمة الإيجار'); return; }
  const data={
    buildingId:bId, name,
    tenantName:document.getElementById('u-tenant').value.trim(),
    tenantPhone:document.getElementById('u-phone').value.trim(),
    rentAmount:rent, quarterlyRent:rent,
    contractNumber:document.getElementById('u-contract').value.trim(),
    paymentPeriod:document.getElementById('u-period').value,
    electricityMeter:document.getElementById('u-meter').value.trim(),
    contractStart:start,
    durationMonths:parseInt(document.getElementById('u-dur').value),
    notes:document.getElementById('u-notes').value.trim()
  };
  let unit;
  if(uId){ unit=db.units.find(x=>x.id===uId); Object.assign(unit,data); }
  else{ unit={id:uid(),...data,payments:[]}; db.units.push(unit); }
  unit.payments=unit.tenantName?buildSchedule(unit):[]; // وحدة شاغرة (بلا مستأجر) لا تُنتج دفعات
  save(); closeModal();
  if(view.name==='building') render(); else go('building',bId);
}
function deleteUnit(uId){
  const u=db.units.find(x=>x.id===uId);
  if(!confirm('سيتم حذف هذه الوحدة وكل دفعاتها نهائيًا. متأكد؟')) return;
  const bId=u.buildingId;
  db.units=db.units.filter(x=>x.id!==uId);
  save(); closeModal(); go('building',bId);
}

function sendUnitWhatsApp(uId){
  const u=db.units.find(x=>x.id===uId);
  const b=db.buildings.find(x=>x.id===u.buildingId);
  const t=unitTotals(u);
  const nx=nextUnpaid(u);
  const msg=`نظام إدارة الإيجارات 🏢\n\nالعقار: ${b.name}\nالوحدة: ${u.name}\nالمستأجر: ${u.tenantName||'—'}\nالإيجار الكامل: ${fmtMoneyText(u.rentAmount)}\nقيمة الدفعة (${periodLbl(u)}): ${fmtMoneyText(periodAmount(u))}\n\nالمحصّل: ${fmtMoneyText(t.paid)}\nالمتبقّي: ${fmtMoneyText(t.remaining)}${nx?'\n\nالدفعة القادمة:\nالتاريخ: '+fmtDate(nx.dueDate)+'\nالمبلغ: '+fmtMoneyText(nx.amount):''}`;
  openWhatsApp(u.tenantPhone,msg);
}
/* تسجيل/التراجع عن سداد كامل. من حالة جزئية أو غير مسدّدة يُكمل الباقي؛ من حالة مسدّدة يعيدها غير مسدّدة */
function togglePay(uId,pId){
  const u=db.units.find(x=>x.id===uId);
  const p=u.payments.find(x=>x.id===pId);
  if(p.status==='paid'){
    p.status='unpaid'; p.paidDate=null; p.paidAmount=0; p.paymentsLog=[];
  } else {
    const rest=remainingAmt(p);
    if(rest>0) (p.paymentsLog=p.paymentsLog||[]).push({id:uid(),date:todayISO(),amount:rest});
    p.status='paid'; p.paidAmount=p.amount; p.paidDate=todayISO();
  }
  save(); openUnit(uId); // إعادة فتح النافذة بنفس الحالة
}
/* نافذة تسجيل دفعة جزئية */

      </div>
      <div class="row2">
        <div class="field"><label>المبلغ المدفوع الآن ( ${db.settings.currency} ) *</label><input type="number" id="pp-amount" value="${rest}" min="1" max="${rest}"></div>

function savePartialPay(uId,pId){
  const u=db.units.find(x=>x.id===uId); if(!u) return;
  const p=(u.payments||[]).find(x=>x.id===pId); if(!p) return;
  const rest=remainingAmt(p);
  let amt=parseFloat(document.getElementById('pp-amount').value)||0;
  const date=document.getElementById('pp-date').value||todayISO();
  if(amt<=0){ alert('أدخل مبلغًا صحيحًا'); return; }
  if(amt>rest) amt=rest; // لا يمكن تجاوز المتبقي
  p.paidAmount=(p.paidAmount||0)+amt;
  (p.paymentsLog=p.paymentsLog||[]).push({id:uid(),date,amount:amt});
  p.paidDate=date;
  p.status = p.paidAmount>=p.amount-0.01 ? 'paid' : 'partial';
  if(p.status==='paid') p.paidAmount=p.amount;
  save(); openUnit(uId);
}
/* التراجع عن آخر دفعة جزئية مسجّلة على الدفعة */
function undoLastPartial(uId,pId){
  const u=db.units.find(x=>x.id===uId); if(!u) return;
  const p=(u.payments||[]).find(x=>x.id===pId); if(!p||!(p.paymentsLog&&p.paymentsLog.length)) return;
  if(!confirm('التراجع عن آخر دفعة جزئية مسجّلة؟')) return;
  const last=p.paymentsLog.pop();
  p.paidAmount=Math.max(0,(p.paidAmount||0)-last.amount);
  p.paidDate=p.paymentsLog.length?p.paymentsLog[p.paymentsLog.length-1].date:null;
  p.status = p.paidAmount<=0.009 ? 'unpaid' : (p.paidAmount>=p.amount-0.01?'paid':'partial');
  save(); openUnit(uId);
}

function paysTotals(payments){
  payments=payments||[];
  const paid=payments.reduce((s,p)=>s+(p.paidAmount!=null?p.paidAmount:(p.status==='paid'?p.amount:0)),0);
  const total=payments.reduce((s,p)=>s+p.amount,0);
  return { paid, total, remaining:total-paid };
}
/* تفقيط المبلغ بالعربية (أعداد صحيحة) */
function tafqit(num){
  num=Math.floor(Math.abs(Number(num)||0));
  if(num===0) return 'صفر';
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const huns=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
  function b3(n){ let s=[]; const h=Math.floor(n/100), r=n%100;
    if(h) s.push(huns[h]);
    if(r){ if(r<20) s.push(ones[r]); else { const t=Math.floor(r/10), o=r%10; s.push(o?ones[o]+' و'+tens[t]:tens[t]); } }
    return s.join(' و'); }
  let parts=[];
  const mil=Math.floor(num/1e6); num%=1e6;
  const th=Math.floor(num/1000); const rest=num%1000;
  if(mil) parts.push(b3(mil)+' مليون');
  if(th){ if(th===1) parts.push('ألف'); else if(th===2) parts.push('ألفان'); else if(th<11) parts.push(b3(th)+' آلاف'); else parts.push(b3(th)+' ألف'); }
  if(rest) parts.push(b3(rest));
  return parts.join(' و');
}

function renewContract(uId){
  const u=db.units.find(x=>x.id===uId);
  const name=document.getElementById('rc-name').value.trim();
  const start=document.getElementById('rc-start').value;
  const rent=parseFloat(document.getElementById('rc-rent').value)||0;
  if(!name){ alert('أدخل اسم المستأجر'); return; }
  if(!start){ alert('أدخل تاريخ بداية العقد الجديد'); return; }
  if(rent<=0){ alert('أدخل قيمة الإيجار'); return; }
  if(u.tenantName){
    u.history=u.history||[];
    u.history.push({ tenantName:u.tenantName, tenantPhone:u.tenantPhone, rentAmount:u.rentAmount, quarterlyRent:u.quarterlyRent,
      contractStart:u.contractStart, durationMonths:u.durationMonths, payments:(u.payments||[]).slice(), archivedAt:todayISO(), reason:'renewal' });
  }
  u.tenantName=name;
  u.tenantPhone=document.getElementById('rc-phone').value.trim();
  u.rentAmount=rent; u.quarterlyRent=rent;
  u.paymentPeriod=document.getElementById('rc-period').value;
  u.electricityMeter=document.getElementById('rc-meter').value.trim();
  u.contractStart=start;
  u.durationMonths=parseInt(document.getElementById('rc-dur').value);
  u.notes=document.getElementById('rc-notes').value.trim();
  u.payments=buildSchedule(u);
  save(); closeModal(); openUnit(uId);
}

function endContract(uId){
  const u=db.units.find(x=>x.id===uId); if(!u||!u.tenantName){ closeModal(); return; }
  const moveOutDate=document.getElementById('ec-date').value||todayISO();
  u.history=u.history||[];
  u.history.push({ tenantName:u.tenantName, tenantPhone:u.tenantPhone, rentAmount:u.rentAmount, quarterlyRent:u.quarterlyRent,
    contractStart:u.contractStart, durationMonths:u.durationMonths, payments:(u.payments||[]).slice(), archivedAt:todayISO(), endedAt:moveOutDate, reason:'ended' });
  u.tenantName=''; u.tenantPhone='';

  save(); closeModal(); openUnit(uId);

/* تصدير المحاسبة Excel/CSV */
function exportAccountingCSV(year,buildingId){
  const filterBuilding=buildingId?db.buildings.find(x=>x.id===buildingId):null;
  /* يمنع "حقن الصيغ" (CSV/Formula Injection): أي نص يبدأ بـ = أو + أو - أو @ قد يُنفَّذ كصيغة عند فتح الملف في Excel */
  const csvSafe=(v)=>{ const s=String(v==null?'':v); return /^[=+\-@\t\r]/.test(s) ? "'"+s : s; };
  const cell=(v)=> (typeof v==='number')? v : '"'+csvSafe(v).replace(/"/g,'""')+'"';
  const rows=[];
  rows.push(['التقرير المحاسبي السنوي', year].concat(filterBuilding?[filterBuilding.name]:[]));
  rows.push([]);
  rows.push(['التفصيل الربع سنوي']);
  rows.push(['الربع','المستحق','المحصّل','المتبقّي','نسبة التحصيل %','المصروفات','الصافي']);
  const qN=['الربع الأول','الربع الثاني','الربع الثالث','الربع الرابع'];
  for(let i=1;i<=4;i++){ const a=acct(year,i,buildingId||null); rows.push([qN[i-1],a.expected,a.collected,a.outstanding,a.rate,a.expenses,a.net]); }
  const yr=acct(year,null,buildingId||null);
  rows.push(['الإجمالي السنوي',yr.expected,yr.collected,yr.outstanding,yr.rate,yr.expenses,yr.net]);
  rows.push([]);
  rows.push([filterBuilding?'العقار':'حسب العقار']);
  rows.push(['العقار','المستحق','المحصّل','المتبقّي','المصروفات','الصافي','الصيانة % من الإيجار','نسبة العائد %']);
  (filterBuilding?[filterBuilding]:db.buildings).forEach(b=>{ const a=acct(year,null,b.id);
    const maintPct=a.expected?Math.round(a.expenses/a.expected*100):0;
    const roi=b.propertyValue?Math.round(a.net/b.propertyValue*1000)/10:'';
    rows.push([b.name,a.expected,a.collected,a.outstanding,a.expenses,a.net,maintPct,roi]); });
  rows.push([]);
  rows.push(['المصروفات']);
  rows.push(['التاريخ','العقار','البند','الوصف','المبلغ']);
  (db.expenses||[]).filter(e=>yearOf(e.date)===year && (!buildingId || e.buildingId===buildingId)).sort((a,b)=>a.date<b.date?1:-1).forEach(e=>{
    const b=db.buildings.find(x=>x.id===e.buildingId);
    rows.push([e.date,(b?b.name:'عام'),e.category||'أخرى',e.note||'',Number(e.amount)||0]);
  });
  const csv='﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='محاسبة-'+year+(filterBuilding?'-'+filterBuilding.name:'')+'.csv'; a.click();
}

    '<li><b>🚪 إنهاء وخروج:</b> لإنهاء العقد دون تحديد مستأجر جديد فورًا. تختار تاريخ الخروج، وتتحول الوحدة إلى <b>شاغرة</b> (بلا دفعات) حتى تُضيف مستأجرًا جديدًا أو تجدّد العقد لاحقًا من نفس الوحدة.</li>'+

   ['❓','أسئلة شائعة',

  ];
  const acc=sec.map((s,i)=>`

      <style>

        .gsec-b b{color:var(--primary-d)}
        .gsec-b .tip{background:var(--info-l);border-radius:0;padding:8px 11px;margin-top:9px;color:var(--info);font-size:12.8px}
        .gsec-ar{transition:.2s;color:var(--muted);font-size:13px;flex:none}
      </style>
      <div class="info-box" style="margin-bottom:12px">📖 <div><b>نظام إدارة الإيجارات</b> — دليل كامل لإدارة العقارات والوحدات ومتابعة الدفعات بدوريات متعددة، مع مزامنة سحابية وإرسال واتساب. اضغط أي قسم لفتحه.</div></div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn btn-sm" onclick="toggleAllGuide(true)">➕ توسيع كل الأقسام</button>

      </div>
      ${acc}
      <div class="formula" style="margin-top:12px">📌 <b>معادلة الاستحقاق:</b> تاريخ الدفعة (ن) = تاريخ بداية العقد + (ن−1) × فترة السداد (شهر/3/6/12).</div>
    </div>
    <div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">إغلاق الدليل</button></div></div>`);
}
function toggleGuide(i){
  const b=document.getElementById('gsec'+i);
  const open=b.style.display!=='none';
  b.style.display=open?'none':'block';
  document.getElementById('gar'+i).style.transform=open?'':'rotate(180deg)';
}
function toggleAllGuide(open){
  document.querySelectorAll('.gsec-b').forEach(b=>{ b.style.display=open?'block':'none'; });
  document.querySelectorAll('.gsec-ar').forEach(a=>{ a.style.transform=open?'rotate(180deg)':''; });
}

/* ============================ الإعدادات والنسخ الاحتياطي ============================ */
function openSettings(){
  const s=db.settings;
  openModal(`<div class="modal"><div class="modal-head"><h3>${svgIcon('settings')} الإعدادات</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>العملة</label><input id="s-cur" value="${esc(s.currency)}"></div>
      <div class="row2">
        <div class="field"><label>تنبيه قبل الاستحقاق <span class="hint">(أيام)</span></label><input type="number" id="s-pay" value="${s.paymentReminderDays}"></div>
        <div class="field"><label>تنبيه التسليم/انتهاء العقد <span class="hint">(أيام)</span></label><input type="number" id="s-deliv" value="${s.deliveryReminderDays}"></div>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);margin:18px 0">
      <div class="field"><label>النسخ الاحتياطي للبيانات</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" onclick="exportData()">${svgIcon('download')} تنزيل نسخة احتياطية</button>
          <button class="btn" onclick="document.getElementById('imp').click()">${svgIcon('upload')} استيراد نسخة</button>
          <input type="file" id="imp" accept="application/json" style="display:none" onchange="importData(this)">
        </div>
        <div class="hint" style="margin-top:8px">${svgIcon('save')} البيانات محفوظة محليًا في هذا المتصفح. نزّل نسخة احتياطية بين فترة وأخرى.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="saveSettings()">${svgIcon('save')} حفظ</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-danger" style="margin-inline-start:auto" onclick="clearAll()">${svgIcon('trash')} مسح كل البيانات</button>
    </div></div>`);
}
function saveSettings(){
  db.settings.currency=document.getElementById('s-cur').value.trim()||'ريال';
  db.settings.paymentReminderDays=parseInt(document.getElementById('s-pay').value)||30;
  db.settings.deliveryReminderDays=parseInt(document.getElementById('s-deliv').value)||60;
  save(); closeModal(); render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='نسخة-الايجارات-'+todayISO()+'.json';
  a.click();
}
function importData(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ try{ const d=JSON.parse(e.target.result);
    if(!d.buildings||!d.units) throw 0;
    if(!confirm('سيتم استبدال البيانات الحالية بالنسخة المستوردة. متابعة؟')) return;
    db=d; db.settings=Object.assign(defaults().settings,db.settings||{});
    save(); closeModal(); go('dashboard');
  }catch(err){ alert('ملف غير صالح'); } };
  r.readAsText(f);
}
function clearAll(){
  if(!confirm('سيتم مسح جميع العقارات والوحدات والدفعات نهائيًا. هل أنت متأكد؟')) return;
  if(!confirm('تأكيد أخير: لا يمكن التراجع عن هذه الخطوة.')) return;
  db=defaults(); save(); closeModal(); go('dashboard');
}

/* ============================ بيانات تجريبية ============================ */
function loadDemo(){
  const b1=uid(), b2=uid();
  db.buildings=[
    {id:b1,name:'عمارة الياسمين',address:'حي النخيل، الرياض',deliveryDate:null,notes:'عمارة سكنية 6 شقق',createdAt:todayISO()},
    {id:b2,name:'برج الواحة التجاري',address:'حي العليا، الرياض',deliveryDate:addMonths(todayISO(),2),notes:'تحت التشطيب النهائي',createdAt:todayISO()}
  ];
  const mk=(bId,name,tenant,phone,rent,start,dur,period)=>{
    const u={id:uid(),buildingId:bId,name,tenantName:tenant,tenantPhone:phone,rentAmount:rent,quarterlyRent:rent,paymentPeriod:period||'quarterly',electricityMeter:'',contractStart:start,durationMonths:dur,notes:'',payments:[]};
    u.payments=u.tenantName?buildSchedule(u):[]; return u;
  };
  db.units=[
    mk(b1,'شقة 1','أحمد العتيبي','0501234567',24000,addMonths(todayISO(),-10),12),
    mk(b1,'شقة 2','خالد الدوسري','0509876543',26000,addMonths(todayISO(),-4),12),
    mk(b1,'شقة 3','','',24000,addMonths(todayISO(),-1),12),
    mk(b2,'محل أرضي 1','مؤسسة النور','0555555555',60000,addMonths(todayISO(),-7),24)
  ];
  // سداد واقعي: أغلب المستحقات الماضية مسدّدة، مع ترك بعض المتأخرات ودفعة جزئية واحدة للتوضيح
  db.units.forEach((u,ui)=>{
    const past=u.payments.filter(p=>daysFromToday(p.dueDate)<0);
    past.forEach((p,i)=>{
      const leaveUnpaid=(ui%2===0)&&i===past.length-1; // اترك آخر متأخرة لوحدات معيّنة
      if(leaveUnpaid) return;
      if(ui===1 && i===past.length-1){ // مثال دفعة جزئية
        p.status='partial'; p.paidAmount=Math.round(p.amount*0.4); p.paidDate=p.dueDate;
        p.paymentsLog=[{id:uid(),date:p.dueDate,amount:p.paidAmount}];
      } else { p.status='paid'; p.paidAmount=p.amount; p.paidDate=p.dueDate;
        p.paymentsLog=[{id:uid(),date:p.dueDate,amount:p.amount}]; }
    });
  });
  // مصروفات تجريبية
  db.expenses=[
    {id:uid(),buildingId:b1,category:'صيانة',amount:1200,date:addMonths(todayISO(),-5),note:'إصلاح مصعد'},
    {id:uid(),buildingId:b1,category:'كهرباء',amount:500,date:addMonths(todayISO(),-2),note:'فاتورة الكهرباء'},
    {id:uid(),buildingId:b1,category:'ماء',amount:300,date:addMonths(todayISO(),-2),note:'فاتورة الماء'},
    {id:uid(),buildingId:b2,category:'رسوم حكومية',amount:2500,date:addMonths(todayISO(),-3),note:'رخصة وتصاريح'}
  ];
  save(); go('dashboard');
}

/* ============================ المزامنة السحابية ============================ */
function spaceIdFromCode(code){
  let h=5381; const s=String(code);
  for(let i=0;i<s.length;i++) h=(((h<<5)+h) ^ s.charCodeAt(i))>>>0;
  return 'sp'+h.toString(36)+s.length;
}
function connectCloud(code){
  cloud.code=code; cloud.enabled=true; cloud.spaceId=spaceIdFromCode(code);
  cloud.ref=fs.collection('rentals').doc(cloud.spaceId);
  localStorage.setItem(CODE_KEY, code);
  loadLocal(); render(); updateSyncBadge();
  if(cloud.unsub){ try{cloud.unsub();}catch(e){} }
  cloud.unsub = cloud.ref.onSnapshot(function(snap){
    cloud.online = true;
    if(snap.exists && snap.data() && snap.data().json){
      try{
        const remote = normalize(JSON.parse(snap.data().json));
        cloud.applyingRemote = true;
        db = remote;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        cloud.applyingRemote = false;
        if(!document.querySelector('.overlay')) render();
      }catch(e){ console.warn('apply remote', e); }
    } else {
      pushCloud(); // أول مرة لهذا الرمز: ارفع البيانات الحالية لإنشاء المساحة
    }
    updateSyncBadge();
  }, function(err){ cloud.online=false; updateSyncBadge(); console.warn('snapshot', err); });
}
function scheduleCloudPush(){ clearTimeout(cloud.saveTimer); cloud.saveTimer=setTimeout(pushCloud, 400); }
function pushCloud(){
  if(!cloud.ref) return;
  cloud.ref.set({ json: JSON.stringify(db), updatedAt: Date.now() })
    .then(function(){ cloud.online=true; updateSyncBadge(); })
    .catch(function(e){ cloud.online=false; updateSyncBadge(); console.warn('push', e); });
}
function cloudLogout(){
  if(!cloud.enabled) return;
  if(!confirm('رمز الدخول الحالي: '+cloud.code+'\n\nتسجيل الخروج من المزامنة على هذا الجهاز؟\nبياناتك تبقى محفوظة في السحابة وتُسترجع بإدخال نفس الرمز.')) return;
  if(cloud.unsub){ try{cloud.unsub();}catch(e){} }
  cloud.enabled=false; cloud.ref=null; cloud.code=null; cloud.unsub=null;
  localStorage.removeItem(CODE_KEY);
  updateSyncBadge(); showGate();
}
function updateSyncBadge(){
  const el=document.getElementById('syncBadge'); if(!el) return;
  if(!cloud.enabled){ el.style.display='none'; return; }
  el.style.display='inline-flex';
  if(cloud.online){ el.className='sync-badge ok'; el.innerHTML='<span class="dot" style="background:var(--success)"></span> متزامن'; }
  else{ el.className='sync-badge off'; el.innerHTML='<span class="dot" style="background:var(--warning)"></span> غير متصل'; }
}

/* ---------- شاشة رمز الدخول ---------- */
function showGate(){
  document.getElementById('modal-root').innerHTML=
    '<div class="overlay gate"><div class="gatebox">'
    +'<div class="gate-logo">'+svgIcon('key')+'</div>'
    +'<h2>نظام إدارة الإيجارات</h2>'
    +'<p>أدخل رمز الدخول للوصول إلى بياناتك على كل الأجهزة.<br>'
    +'<span class="gate-hint">أول مرة؟ اختر رمزًا جديدًا (يفضّل 8 خانات فأكثر، حروف وأرقام) واحفظه — هو مفتاح بياناتك.</span></p>'
    +'<input id="gate-code" type="password" inputmode="text" placeholder="رمز الدخول" onkeydown="if(event.key===\'Enter\')submitGate()">'
    +'<button class="btn btn-primary gate-btn" onclick="submitGate()">'+svgIcon('unlock')+' دخول ومزامنة</button>'
    +'<div class="gate-foot">'+svgIcon('lock')+' بياناتك مرتبطة بهذا الرمز. لا تشاركه إلا مع من تريد أن يطّلع على نفس البيانات أو يعدّلها.</div>'
    +'</div></div>';
  setTimeout(function(){ var i=document.getElementById('gate-code'); if(i) i.focus(); }, 60);
}
function submitGate(){
  var code=(document.getElementById('gate-code').value||'').trim();
  if(!code){ alert('أدخل رمز الدخول.'); return; }
  closeModal();
  connectCloud(code);
}

/* ============================ فحص التحديثات ============================ */
const APP_BUILD = document.querySelector('meta[name="app-build"]').content;
function checkForUpdate(){
  fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.text(); })
    .then(function(html){
      const m = html.match(/name="app-build" content="([^"]+)"/);
      if(m && m[1] && m[1] !== APP_BUILD && !document.getElementById('updateBanner')){
        const b=document.createElement('div');
        b.id='updateBanner'; b.className='update-banner';
        b.innerHTML='يوجد تحديث جديد للتطبيق <button onclick="applyUpdate()">تحديث الآن</button>';
        document.body.appendChild(b);
      }
    })
    .catch(function(){});
}
function applyUpdate(){
  // location.reload() قد يُعيد الصفحة من ذاكرة التخزين المؤقت للمتصفح على بعض أجهزة الجوال؛
  // استخدام رابط بمعامل فريد يضمن جلب نسخة جديدة فعليًا من الخادم
  location.href = location.pathname + '?v=' + Date.now();
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') checkForUpdate(); });
setInterval(checkForUpdate, 20*1000);

/* ============================ التشغيل ============================ */
function bootstrap(){
  if(cloud.ready){
    var saved=localStorage.getItem(CODE_KEY);
    if(saved){ connectCloud(saved); }
    else{ loadLocal(); render(); showGate(); }
  } else {
    // تعذّر تحميل Firebase (بلا إنترنت مثلًا): وضع محلي فقط على هذا الجهاز
    loadLocal(); render();
  }
  checkForUpdate();
}
bootstrap();
</script>
